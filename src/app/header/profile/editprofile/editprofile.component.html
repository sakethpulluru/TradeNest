
@if (incorrectData) {
  <app-dialog content="Enter Valid Data to submit" id="dialogue" (close)="close()"></app-dialog>
  }
<div class="container my-5">
  <h2 class="text-center mb-4">Edit Profile</h2>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group mb-3">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" [(ngModel)]="usernames" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group mb-3">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Enter your email" required email>
        </div>
        <div class="form-group mb-3">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Enter a new password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</div>
