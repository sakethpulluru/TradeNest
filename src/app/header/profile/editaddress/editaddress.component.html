@if (incorrectData) {
  <app-dialog content="Enter Valid Data to submit" id="dialogue" (close)="close()"></app-dialog>
  }
<div class="container my-5">
  <h2 class="text-center mb-4">Edit Address</h2>
  <div class="row justify-content-center">
    <div class="col-md-8">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group mb-3">
          <label for="address">Address</label>
          <input type="text" id="address" class="form-control" [(ngModel)]="user.address.address" name="address" placeholder="Enter your address" required>
        </div>
        <div class="form-group mb-3">
          <label for="city">City</label>
          <input type="text" id="city" class="form-control" [(ngModel)]="user.address.city" name="city" placeholder="Enter your city" required>
        </div>
        <div class="form-group mb-3">
          <label for="state">State</label>
          <input type="text" id="state" class="form-control" [(ngModel)]="user.address.state" name="state" placeholder="Enter your state" required>
        </div>
        <div class="form-group mb-3">
          <label for="postcode">Postcode</label>
          <input type="text" id="postcode" class="form-control" [(ngModel)]="user.address.postalCode" name="postcode" placeholder="Enter your postcode" required>
        </div>
        <div class="form-group mb-3">
          <label for="country">Country</label>
          <input type="text" id="country" class="form-control" [(ngModel)]="user.address.country" name="country" placeholder="Enter your country" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>
</div>
